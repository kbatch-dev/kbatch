apiVersion: v1
kind: ResourceQuota
metadata:
  name: mem-cpu-demo
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-resources
spec:
  limits:
    # default is default limit
  - default:
      cpu: 500m
      memory: 500M
    # default request
    defaultRequest:
      cpu: 500m
      memory: 100M
    # bounds
    max:
      cpu: "1"
      memory: 1Gi
    min:
      cpu: 100m
      memory: 64M
    type: Container
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ns-config-map
data:
  key: value
---

# trailing --- to test empty-element handling
---
